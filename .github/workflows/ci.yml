name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install Dependencies
      run: |
        cargo install cargo-binutils
        cargo install --git https://github.com/probe-rs/probe-rs target-gen --rev 7ff6ee913c0e78b9752c062760ee8dce021a3a01
    - name: Build
      run: |
        ./build.sh
    - name: Run tests
      run: cargo test --verbose
